# name: CI/CD with Semantic Release and GKE

# on:
#   push:
#     branches:
#       - "master"
#       - "dev"
#   pull_request:
#     branches:
#       - "dev"
#       - "master"

name: Python App CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - "dev"
      - "master"
  # workflow_dispatch:  # also allow manual trigger

# env:
#   IMAGE_NAME: adinath16/python-app

jobs:
  docker-publish:
    # needs: build
    runs-on: ubuntu-latest
    environment:
      name: dockerhub-publish 
    # environment:
    #   name: ${{ github.ref_name == 'main' && 'prod-approval' || 'dev' }} # Prod requires approval
    env:
      BRANCH_NAME: ${{ github.ref_name }}
      DOCKERHUB_USER: yourdockerhub
    steps:
      - uses: actions/checkout@v3

      - name: Set IMAGE_NAME
        id: image
        run: |
          if [ "$BRANCH_NAME" = "main" ]; then
            echo "IMAGE_NAME=$DOCKERHUB_USER/python-app" >> $GITHUB_ENV
          else
            echo "IMAGE_NAME=$DOCKERHUB_USER/python-app-$BRANCH_NAME" >> $GITHUB_ENV
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        run: |
          SHA=${GITHUB_SHA::7}
          echo "Using image: $IMAGE_NAME"
          docker build -t $IMAGE_NAME:$SHA .
          docker tag $IMAGE_NAME:$SHA $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$SHA
          docker push $IMAGE_NAME:latest